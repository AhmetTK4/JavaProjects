<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conway's Game of Life</title>
    <style>
        table { border-collapse: collapse; }
        td { width: 20px; height: 20px; text-align: center; }
        .alive { background-color: black; }
        .dead { background-color: white; }
    </style>
</head>
<body>
<h2>Conway's Game of Life</h2>

<!-- Form alanı: Kullanıcının rows, cols ve hız değerlerini girmesini sağlar -->
<form id="gridForm">
    <label>Rows: <input type="number" id="rows" value="10" min="1" max="200"></label>
    <label>Columns: <input type="number" id="cols" value="10" min="1" max="200"></label>
    <label>Update Interval (ms): <input type="number" id="interval" value="500" min="50"></label>
    <button type="submit">Start</button>
    <button type="button" id="stop">Stop</button>
</form>
<p id="error" role="alert"></p>

<table id="grid"></table>

<script>
    let timeoutId;
    let running = false;

    document.getElementById('gridForm').onsubmit = (event) => {
        event.preventDefault(); // Formun varsayılan gönderimini engeller
        const rows = document.getElementById('rows').value;
        const cols = document.getElementById('cols').value;
        const interval = Number(document.getElementById('interval').value);
        startSimulation(rows, cols, interval);
    };
    document.getElementById('stop').onclick = stopSimulation;

    function renderGrid(cells) {
        const gridElement = document.getElementById("grid");
        // Tabloyu yalnızca boyut değiştiğinde yeniden oluştur, aksi halde hücre sınıflarını güncelle
        if (gridElement.rows.length !== cells.length || gridElement.rows[0].cells.length !== cells[0].length) {
            gridElement.innerHTML = '';
            cells.forEach(row => {
                const rowElement = gridElement.insertRow();
                row.forEach(() => rowElement.insertCell());
            });
        }
        cells.forEach((row, i) => row.forEach((alive, j) => {
            gridElement.rows[i].cells[j].className = alive ? "alive" : "dead";
        }));
    }

    async function fetchGeneration(rows, cols, reset) {
        const response = await fetch(`/nextGeneration?rows=${rows}&cols=${cols}&reset=${reset}`);
        if (!response.ok) {
            const problem = await response.json().catch(() => ({}));
            throw new Error(problem.detail || `Request failed with status ${response.status}`);
        }
        return response.json();
    }

    async function step(rows, cols, interval, reset) {
        try {
            renderGrid(await fetchGeneration(rows, cols, reset));
            document.getElementById('error').textContent = '';
        } catch (e) {
            document.getElementById('error').textContent = e.message;
            stopSimulation();
            return;
        }
        // Bir sonraki isteği ancak bu istek bittikten sonra planla, böylece istekler üst üste binmez
        if (running) {
            timeoutId = setTimeout(() => step(rows, cols, interval, false), interval);
        }
    }

    function startSimulation(rows, cols, interval) {
        stopSimulation();
        running = true;
        step(rows, cols, interval, true);
    }

    function stopSimulation() {
        running = false;
        clearTimeout(timeoutId);
    }
</script>
</body>
</html>
