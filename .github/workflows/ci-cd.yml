name: Verify Java examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [GameOfLife, jacoco-demo, StrategyDesignPattern, PlayWithCaches, PlayWithGenerics, PlayWithJson, PlayWithStreams, PlayWithThreads, ProxyDesignPattern, kullanici-servis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Verify example
        run: mvn -B -ntp -f ${{ matrix.project }}/pom.xml verify
