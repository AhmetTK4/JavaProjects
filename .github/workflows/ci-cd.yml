name: Verify Java examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [GameOfLife, jacoco-demo, StrategyDesignPattern, PlayWithCaches, PlayWithGenerics, PlayWithJson, PlayWithStreams, PlayWithThreads, ProxyDesignPattern, kullanici-servis]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Verify example
        run: mvn -B -ntp -f ${{ matrix.project }}/pom.xml verify
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.project }}/target/surefire-reports/
            ${{ matrix.project }}/target/failsafe-reports/
            ${{ matrix.project }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload verified build
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.project }}/target/*.jar
            ${{ matrix.project }}/target/*.war
            ${{ matrix.project }}/target/quarkus-app/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
