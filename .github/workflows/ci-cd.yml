name: Verify Java examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.project }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [GameOfLife, jacoco-demo, StrategyDesignPattern, PlayWithCaches, PlayWithGenerics, PlayWithJson, PlayWithStreams, PlayWithThreads, ProxyDesignPattern, kullanici-servis]
        # 21 is the baseline; 25 catches newer-JDK breakage (e.g. annotation processing changes).
        java: ['21', '25']
        exclude:
          # Quarkus 3.15 does not support Java 25; remove after upgrading Quarkus.
          - project: kullanici-servis
            java: '25'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Verify example with coverage
        env:
          PROJECT: ${{ matrix.project }}
          JACOCO: org.jacoco:jacoco-maven-plugin:0.8.15
        run: |
          case "$PROJECT" in
            # These configure coverage themselves (jacoco-maven-plugin / quarkus-jacoco).
            jacoco-demo|kullanici-servis)
              mvn -B -ntp -f "$PROJECT/pom.xml" verify ;;
            *)
              mvn -B -ntp -f "$PROJECT/pom.xml" "$JACOCO:prepare-agent" verify "$JACOCO:report" ;;
          esac
      - name: Coverage summary
        if: ${{ !cancelled() }}
        env:
          PROJECT: ${{ matrix.project }}
          JAVA: ${{ matrix.java }}
        run: |
          csv="$PROJECT/target/site/jacoco/jacoco.csv"
          if [ -f "$csv" ]; then
            awk -F, -v p="$PROJECT" -v j="$JAVA" 'NR > 1 { missed += $8; covered += $9 }
              END { if (missed + covered > 0) printf "**Line coverage** %s (JDK %s): %.1f%% (%d/%d lines)\n", p, j, 100 * covered / (missed + covered), covered, missed + covered }' \
              "$csv" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.project }}-jdk${{ matrix.java }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.project }}/target/surefire-reports/
            ${{ matrix.project }}/target/failsafe-reports/
            ${{ matrix.project }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload verified build
        if: ${{ matrix.java == '21' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.project }}/target/*.jar
            ${{ matrix.project }}/target/*.war
            ${{ matrix.project }}/target/quarkus-app/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
