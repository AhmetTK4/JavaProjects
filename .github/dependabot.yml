version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /GameOfLife
      - /jacoco-demo
      - /StrategyDesignPattern
      - /PlayWithCaches
      - /PlayWithGenerics
      - /PlayWithJson
      - /PlayWithStreams
      - /ProxyDesignPattern
      - /kullanici-servis
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep springdoc aligned with Spring Boot 3.3; update together during migration.
    ignore:
      - dependency-name: 'org.springdoc:*'
        versions: ['>=2.7.0']
  - package-ecosystem: maven
    directory: /PlayWithThreads
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'org.springdoc:*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly


