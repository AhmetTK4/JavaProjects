spring.application.name=PlayWithThreads
# Defaults target the local Mailpit container from compose.yaml; see README.md for Gmail.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Task notification e-mails are sent only to this operator-configured address.
app.notification.recipient=${NOTIFICATION_RECIPIENT:}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=group_id
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# E-mail is optional in this demo; an unreachable SMTP server should not mark the app DOWN.
management.health.mail.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoints.web.base-path=/actuator
spring.mvc.problemdetails.enabled=true
# Scheduled demo jobs (ISO-8601 durations)
app.scheduler.task1-rate=PT30S
app.scheduler.task2-rate=PT1M
