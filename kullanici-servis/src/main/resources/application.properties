quarkus.http.port=9095

quarkus.datasource.db-kind=postgresql
# Schema is managed by Flyway migrations in src/main/resources/db/migration.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Dev mode (mvn quarkus:dev) starts PostgreSQL automatically with Dev Services (needs Docker).
# Production reads the connection from the environment; there are no default credentials.
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Tests use in-memory H2 so they run without Docker.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:kullanici;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.devservices.enabled=false

# Coverage report of quarkus-jacoco, in the same place as the other examples' reports.
%test.quarkus.jacoco.report-location=target/site/jacoco
